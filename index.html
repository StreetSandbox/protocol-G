<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETWATCH Surveillance Terminal</title>
<style>
:root{--bg:#05070a;--panel:#0a1016;--line:#123;--cyan:#4ff;--blue:#3aa0ff;--green:#38ff9c;--red:#ff4a5e;--amber:#ffcc4d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#bfe9ff;font:12px/1.45 "Courier New",monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;background:#070d12}
header h1{font-size:14px;color:var(--cyan);letter-spacing:2px}
.grid{flex:1;display:grid;grid-template-columns:230px 1fr 280px;gap:8px;padding:8px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:11px;color:var(--cyan);padding:7px 10px;border-bottom:1px solid var(--line);letter-spacing:1px}
.body{padding:10px;overflow:auto;flex:1}
.metric{margin-bottom:12px}
.metric span{display:flex;justify-content:space-between;color:#7fb9d8}
.bar{height:6px;background:#101a22;border:1px solid #173242;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cyan);width:0%}
#canvas{position:relative;background:radial-gradient(circle at 50% 50%,#08131c,#04070a);cursor:crosshair;overflow:hidden;touch-action:none}
#canvas::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,255,255,.03) 3px 4px);pointer-events:none}
#zone{position:absolute;border:1px dashed rgba(56,255,156,.35);pointer-events:none}
.node{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;border:2px solid var(--blue);background:rgba(20,40,70,.78);color:#dff;cursor:grab;user-select:none;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 0 16px rgba(58,160,255,.45)}
.node.green{border-color:var(--green);box-shadow:0 0 18px rgba(56,255,156,.5);animation:pulse 1.4s infinite}
.node.red{border-color:var(--red);box-shadow:0 0 18px rgba(255,74,94,.5)}
.node small{font-size:9px;color:#9fd}
.node .pct{font-size:13px;font-weight:bold}
.node .load{width:56px;height:5px;background:#0c1620;border:1px solid #1d3a4a}
.node .load i{display:block;height:100%;width:10%;background:var(--cyan)}
.node.green .load i{background:var(--green)}.node.red .load i{background:var(--red)}
@keyframes pulse{50%{transform:scale(1.04)}}
#log{font-size:10px}
#log div{padding:2px 0;border-bottom:1px dashed #102030;word-break:break-word}
.warn{color:var(--amber)}.crit{color:var(--red)}.ok{color:var(--green)}
footer{border-top:1px solid var(--line);padding:8px 14px;display:flex;justify-content:space-between;background:#070d12;color:#7fb9d8}
</style>
</head>
<body>
<header><h1>NETWATCH SURVEILLANCE TERMINAL</h1><div id="clock">--:--:--</div></header>

<div class="grid">
  <section class="panel"><h2>SYS.DIAG</h2><div class="body" id="diag"></div></section>

  <section class="panel"><h2>MAIN CANVAS // DOUBLE-TAP TO DEPLOY NODE</h2>
    <div id="canvas"><div id="zone"></div></div>
  </section>

  <section class="panel"><h2>EVENT.LOG</h2><div class="body" id="log"></div></section>
</div>

<footer><span>UPTIME <b id="uptime">00:00:00</b></span><span>PACKETS <b id="packets">0</b></span><span>NODES <b id="nodes">0</b></span></footer>

<script>
const $=id=>document.getElementById(id), canvas=$("canvas"), zone=$("zone"), log=$("log");
let node=null, packets=0, start=Date.now();
let pressTimer=null, chargeTimer=null, pressStart=0, moved=false, dragging=false, lastTap=0;

function addLog(msg,cls=""){const d=document.createElement("div");d.className=cls;d.textContent=msg;log.prepend(d);while(log.children.length>60)log.lastChild.remove();}
function setZone(){const r=canvas.getBoundingClientRect(),w=r.width*.4,h=r.height*.4;zone.style.cssText+=`;left:${(r.width-w)/2}px;top:${(r.height-h)/2}px;width:${w}px;height:${h}px`;}
function inZone(){if(!node)return false;const r=canvas.getBoundingClientRect(),z=zone.getBoundingClientRect(),n=node.getBoundingClientRect();const cx=n.left+n.width/2,cy=n.top+n.height/2;return cx>=z.left&&cx<=z.right&&cy>=z.top&&cy<=z.bottom;}
function updateState(){
  if(!node||node.dataset.failed==="1")return;
  const ok=inZone();
  node.classList.toggle("green",ok);
  node.querySelector("small").textContent=ok?"LINK_CONN":"LINK_DISC";
}
function spawn(x,y){
  if(node){addLog("[WARN] NODE INTERFACE LAYER ALLOCATION ENGAGED","warn");return;}
  node=document.createElement("div");node.className="node";
  node.innerHTML='<div class="pct">10%</div><small>LINK_DISC</small><div class="load"><i></i></div>';
  node.style.left=x+"px";node.style.top=y+"px";canvas.appendChild(node);
  node.dataset.failed="0";node.dataset.progress="10";
  addLog("[SYS] DEVICE NODE DEPLOYED @ "+Math.round(x)+","+Math.round(y),"ok");
  updateState();$("nodes").textContent=1;
}
function failNode(){
  if(!node||node.dataset.failed==="1")return;
  node.dataset.failed="1";node.classList.remove("green");node.classList.add("red");
  node.querySelector("small").textContent="LINK_FAIL";
  node.querySelector(".pct").textContent="ERR";
  addLog("[CRIT] RECON CALIBRATION LINK TIMEOUT","crit");
}
function startCharge(){
  if(!node||node.dataset.failed==="1"||chargeTimer)return;
  chargeTimer=setInterval(()=>{
    if(!node||node.dataset.failed==="1"){clearInterval(chargeTimer);chargeTimer=null;return;}
    let p=Math.min(100,+node.dataset.progress+2);
    node.dataset.progress=p;
    node.querySelector(".pct").textContent=p+"%";
    node.querySelector(".load i").style.width=p+"%";
    if(p>=100){clearInterval(chargeTimer);chargeTimer=null;addLog("[SYS] SIGNAL CHARGE COMPLETE","ok");}
  },60);
}
function stopCharge(){clearInterval(chargeTimer);chargeTimer=null;}
function canvasPos(e){const r=canvas.getBoundingClientRect(),t=e.changedTouches?e.changedTouches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function nodeHit(e){if(!node)return false;const r=node.getBoundingClientRect(),t=e.changedTouches?e.changedTouches[0]:e;return t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom;}

// Double-tap deployment: works for touch and mouse.
function handleTap(e){
  const now=Date.now(), p=canvasPos(e), onNode=nodeHit(e);
  if(onNode){
    if(now-pressStart<250&&!moved)failNode();
    return;
  }
  if(now-lastTap<300){
    lastTap=0;spawn(p.x,p.y);
  }else lastTap=now;
}
canvas.addEventListener("touchend",e=>{e.preventDefault();handleTap(e);},{passive:false});
canvas.addEventListener("click",e=>{if(e.pointerType!=="touch")handleTap(e);});

// Pointer press, hold-to-charge, and drag.
function down(e){
  if(!node||!nodeHit(e))return;
  e.preventDefault();pressStart=Date.now();moved=false;dragging=true;
  node.setPointerCapture&&node.setPointerCapture(e.pointerId);
  pressTimer=setTimeout(()=>{if(!moved&&Date.now()-pressStart>=250)startCharge();},250);
}
function move(e){
  if(!dragging||!node)return;
  const p=canvasPos(e);moved=true;
  node.style.left=p.x+"px";node.style.top=p.y+"px";
  updateState();
}
function up(e){
  clearTimeout(pressTimer);pressTimer=null;
  if(dragging){dragging=false;stopCharge();handleTap(e);}
}
canvas.addEventListener("pointerdown",down);
canvas.addEventListener("pointermove",move);
canvas.addEventListener("pointerup",up);
canvas.addEventListener("pointercancel",()=>{clearTimeout(pressTimer);dragging=false;stopCharge();});

// Diagnostics and footer tickers.
const metrics=[["CPU CORE LOAD",0],["MEM ALLOCATION",0],["NET THROUGHPUT",0],["SENSOR ARRAY",0]];
metrics.forEach(([n])=>{const d=document.createElement("div");d.className="metric";d.innerHTML=`<span>${n}<b>0%</b></span><div class="bar"><i></i></div>`;$("diag").appendChild(d);});
setInterval(()=>{
  metrics.forEach((m,i)=>{const v=20+Math.round(Math.random()*70),el=$("diag").children[i];el.querySelector("b").textContent=v+"%";el.querySelector(".bar i").style.width=v+"%";});
  packets+=Math.round(Math.random()*40);$("packets").textContent=packets;
},1000);
setInterval(()=>{
  const s=Math.floor((Date.now()-start)/1000),p=n=>String(n).padStart(2,"0");
  $("uptime").textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;
  $("clock").textContent=new Date().toLocaleTimeString();
},1000);

addEventListener("resize",setZone);setZone();
addLog("[BOOT] NETWATCH TERMINAL ONLINE","ok");
addLog("[SYS] AWAITING NODE DEPLOYMENT");
</script>
</body>
</html>
